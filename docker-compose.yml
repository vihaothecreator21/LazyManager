services:
  gateway:
    image: nginx:1.29-alpine
    container_name: lazymanager-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - people-service
      - inventory-service
    networks:
      - lazymanager-network

  frontend:
    build:
      context: ./frontend
    container_name: lazymanager-frontend
    expose:
      - "80"
    networks:
      - lazymanager-network

  people-service:
    build:
      context: ./services/people-service
    container_name: lazymanager-people-service
    expose:
      - "8000"
    environment:
      APP_NAME: LazyManager People Service
      APP_ENV: local
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${PEOPLE_APP_KEY:?Set PEOPLE_APP_KEY}
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: people-db
      DB_PORT: "5432"
      DB_DATABASE: people_db
      DB_USERNAME: lazymanager
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lazymanager}
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-lazymanager-people-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lazymanager}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      AUTH_ACCESS_COOKIE: ${AUTH_ACCESS_COOKIE:-lm_access_token}
      AUTH_REFRESH_COOKIE: ${AUTH_REFRESH_COOKIE:-lm_refresh_token}
      AUTH_CSRF_COOKIE: ${AUTH_CSRF_COOKIE:-lm_csrf_token}
      AUTH_ACCESS_TTL_MINUTES: ${AUTH_ACCESS_TTL_MINUTES:-15}
      AUTH_REFRESH_TTL_MINUTES: ${AUTH_REFRESH_TTL_MINUTES:-10080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      RUN_DEMO_SEEDERS: ${RUN_DEMO_SEEDERS:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      people-db:
        condition: service_healthy
    networks:
      - lazymanager-network

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: lazymanager-inventory-service
    expose:
      - "8000"
    environment:
      APP_NAME: LazyManager Inventory Service
      APP_ENV: local
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${INVENTORY_APP_KEY:?Set INVENTORY_APP_KEY}
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: inventory-db
      DB_PORT: "5432"
      DB_DATABASE: inventory_db
      DB_USERNAME: lazymanager
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lazymanager}
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-lazymanager-people-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lazymanager}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      AUTH_ACCESS_COOKIE: ${AUTH_ACCESS_COOKIE:-lm_access_token}
      AUTH_CSRF_COOKIE: ${AUTH_CSRF_COOKIE:-lm_csrf_token}
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - lazymanager-network

  people-db:
    image: postgres:17-alpine
    container_name: lazymanager-people-db
    environment:
      POSTGRES_DB: people_db
      POSTGRES_USER: lazymanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazymanager}
    volumes:
      - people-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazymanager -d people_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lazymanager-network

  inventory-db:
    image: postgres:17-alpine
    container_name: lazymanager-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: lazymanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazymanager}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazymanager -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lazymanager-network

networks:
  lazymanager-network:
    driver: bridge

volumes:
  people-db-data:
  inventory-db-data:
