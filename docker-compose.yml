services:
  gateway:
    image: nginx:1.29-alpine
    container_name: lazymanager-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - people-service
      - inventory-service
    networks:
      - lazymanager-network

  frontend:
    build:
      context: ./frontend
    container_name: lazymanager-frontend
    expose:
      - "5173"
    environment:
      VITE_API_BASE_URL: /api
    networks:
      - lazymanager-network

  people-service:
    build:
      context: ./services/people-service
    container_name: lazymanager-people-service
    expose:
      - "8000"
    environment:
      APP_NAME: LazyManager People Service
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${PEOPLE_APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: people-db
      DB_PORT: "5432"
      DB_DATABASE: people_db
      DB_USERNAME: lazymanager
      DB_PASSWORD: lazymanager
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    depends_on:
      people-db:
        condition: service_healthy
    networks:
      - lazymanager-network

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: lazymanager-inventory-service
    expose:
      - "8000"
    environment:
      APP_NAME: LazyManager Inventory Service
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${INVENTORY_APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: inventory-db
      DB_PORT: "5432"
      DB_DATABASE: inventory_db
      DB_USERNAME: lazymanager
      DB_PASSWORD: lazymanager
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - lazymanager-network

  people-db:
    image: postgres:17-alpine
    container_name: lazymanager-people-db
    environment:
      POSTGRES_DB: people_db
      POSTGRES_USER: lazymanager
      POSTGRES_PASSWORD: lazymanager
    volumes:
      - people-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazymanager -d people_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lazymanager-network

  inventory-db:
    image: postgres:17-alpine
    container_name: lazymanager-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: lazymanager
      POSTGRES_PASSWORD: lazymanager
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazymanager -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lazymanager-network

networks:
  lazymanager-network:
    driver: bridge

volumes:
  people-db-data:
  inventory-db-data:
