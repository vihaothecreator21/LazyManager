map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    location = /api/people/health {
        proxy_pass http://people-service:8000/health;
    }

    location = /api/people/ready {
        proxy_pass http://people-service:8000/ready;
    }

    location /api/people/v1/ {
        rewrite ^/api/people/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://people-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/inventory/health {
        proxy_pass http://inventory-service:8000/health;
    }

    location = /api/inventory/ready {
        proxy_pass http://inventory-service:8000/ready;
    }

    location /api/inventory/v1/ {
        rewrite ^/api/inventory/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://inventory-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
